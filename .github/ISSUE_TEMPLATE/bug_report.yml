name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.1, MacBook Air M3
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Dictation mode
      options: [Apple Speech, Local model (Parakeet), Local model (Whisper), Cloud (Groq), Cloud (OpenAI), Cloud (Gemini)]
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please don't paste API keys or private transcripts.
